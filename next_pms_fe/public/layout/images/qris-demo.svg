  <text x="200" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">BCA Mobile • Livin' Mandiri • BRImo • BNI Mobile • GoPay • OVO • DANA • ShopeePay</text>
