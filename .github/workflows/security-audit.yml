name: Security Audit & Hardening Checks

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'chore/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Secret Scanning with Gitleaks
  # ----------------------------------------------------------------------------
  gitleaks:
    name: Secret Leak Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ----------------------------------------------------------------------------
  # Job 2: Backend Security & Hardening Tests
  # ----------------------------------------------------------------------------
  backend-security:
    name: Backend Security Audit & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./express_pms_be
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './express_pms_be/package-lock.json'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Dependency Vulnerability Audit (npm audit)
        run: |
          echo "Running npm audit for express_pms_be..."
          npm audit --audit-level=high || echo "Vulnerabilities detected in backend dependencies. Review audit report above."
        continue-on-error: true

      - name: Run Backend Hardening Unit & Integration Tests
        run: npm test -- --testPathIgnorePatterns="app.test.js"
        env:
          NODE_ENV: test
          APP_DEBUG: "true"
          ORIGIN: "http://localhost:3000"
          USER_KEY: "unit_test_dummy_user_key_32_characters_minimum"
          USER_PAS_KEY: "unit_test_dummy_user_pas_key"
          USER_SECRET: "unit_test_dummy_user_secret_32_characters_min"
          DB_HOST: "127.0.0.1"
          DB_PORT: "3306"
          DB_DBMS: "mysql2"
          DB_DATABASE: "hotel_pms"
          DB_USERNAME: "root"
          DB_PASSWORD: ""

  # ----------------------------------------------------------------------------
  # Job 3: Frontend Security & Linting Checks
  # ----------------------------------------------------------------------------
  frontend-security:
    name: Frontend Security Audit & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./next_pms_fe
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './next_pms_fe/package-lock.json'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Run Dependency Vulnerability Audit (npm audit)
        run: |
          echo "Running npm audit for next_pms_fe..."
          npm audit --audit-level=high || echo "Vulnerabilities detected in frontend dependencies. Review audit report above."
        continue-on-error: true

      - name: Run Next.js Lint Checks
        run: npm run lint || true
